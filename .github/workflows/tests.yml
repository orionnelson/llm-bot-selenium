name: Synthetic regression
on:
  push:
    branches: [blue-master, blue-selenium-initial]
  pull_request:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: python evaluate.py > evaluation-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evaluation
          path: evaluation-results.json
